name: Generate shared/currencies.json

on: 
  pull_request:
    paths:
      - 'generator/**'

permissions: 
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Generate currencies.json
        run: npm run generate

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- shared/currencies.json; then 
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add shared/currencies.json
            git commit -m "chore: regenerate currencies.json [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No changes to currencies.json"
          fi
